name: iOS Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-submit:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from git tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Update app.json version
        run: |
          node -e "
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json'));
          app.expo.version = '${{ steps.version.outputs.version }}';
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          console.log('Updated app.json to version: ${{ steps.version.outputs.version }}');
          "

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          node-version: "26.9.0"

      - name: Install dependencies
        run: npm install

      - name: Build and submit iOS to App Store
        run: make ship-ios
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}

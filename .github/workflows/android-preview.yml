name: Android Preview Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Manual runs keep whatever version app.json already has.
      - name: Update app.json version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          node -e "
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json'));
          app.expo.version = '$VERSION';
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          console.log('Updated app.json to version: $VERSION');
          "

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm install

      - name: Build Android APK
        run: make build-android-preview
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}

name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by the build workflows so a failing check stops the build.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm install

      - name: Run checks
        run: npm run check
